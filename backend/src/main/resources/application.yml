server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-secret-key-must-be-changed-in-production-min-256-bits}
  access-token-expiry: 900000
  refresh-token-expiry: 604800000

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:iemcrp}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

turnstile:
  secret-key: ${TURNSTILE_SECRET_KEY:}

logging:
  level:
    com.iemcrp: INFO
    org.hibernate.SQL: DEBUG

resilience4j:
  ratelimiter:
    instances:
      auth:
        limitForPeriod: 10
        limitRefreshPeriod: 1m
        timeoutDuration: 0
      api:
        limitForPeriod: 100
        limitRefreshPeriod: 1m
        timeoutDuration: 0
  circuitbreaker:
    instances:
      db:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
      redis:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 3
